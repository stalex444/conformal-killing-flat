      2026-11-04 to 2026-11-08 (3e389ef8b2114fa643ab3d939e71ea99ab748085,
      2856b93cb8b144ce491ce422bd499c2f21aa496e,
      37853b557381de79a4744a7aba900611e9406fa4). The general
      theory of Killing fields on Riemannian manifolds: the structure
      IsKillingField (vanishing Lie derivative of the metric), closure
      under sums and scalar multiples, the characterization through a
      metric-compatible torsion-free connection, the second covariant
      derivative in terms of curvature, Killing fields as Jacobi fields
