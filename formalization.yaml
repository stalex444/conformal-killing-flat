      defined.

status:
  scope: >-
    Formalized: nine compared theorems, in comparator order, namespace
    FlatConformalKilling (see the description for their content), on
    thirteen definitions carried by the Challenge: Vec, Tens, IsSignature,
    partialD, IsConformalKilling, IsKilling, family, conformalKilling,
    killing, divT, current, divJ, traceEta. Proved in the repository, not
    compared (namespace ConformalKillingFlat): every member of the family
    is conformal Killing, with no hypothesis on eta
    (isConformalKilling_family); the linear equivalences of the solution
    spaces with their parameter spaces (paramEquiv, for n >= 3 and entries
    +1 or -1; paramEquivK, every n); the dimension n(n-1)/2 of the
    antisymmetric matrices (finrank_skew) and their identification with
    Mathlib's so (skew_eq_so); the values 15 and 10 in dimension four
    (finrank_conformalKilling_four, finrank_killing_four); Killing fields
    are conformal Killing (killing_le_conformalKilling); a second control
    for n >= 3, of the same form as statement 5, in the Lorentzian plane
    (exists_conformalKilling_lorentzian_two_not_family); the product rule
    for the divergence of a current without any symmetry or Killing
    hypothesis (div_current). Not formalized: general constant metrics, by
    a linear change of coordinates; solutions of regularity below C^3; the
    vector-field form of the statements; the Lie algebra structure on the
    solution spaces and the isomorphism of the conformal Killing fields
    with so(p+1,q+1); the finite conformal transformations, that is,
    Liouville's theorem on conformal maps; fields on proper open subsets
    of R^n; dimension two beyond the two controls; compactly supported
    tensor fields in statements 7 and 8.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

