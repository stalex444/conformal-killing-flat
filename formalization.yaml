  - id: "https://github.com/TauCetiProject/TauCeti/tree/1e668f5e55bc20f2eb87f4ba49b48833470290d1/TauCeti/Geometry/Manifold/Riemannian/Killing"
    relationship: "other"
    note: >-
      RELATED, NOT THESE THEOREMS. Read on 2026-11-11 at commit
      1e668f5e55bc20f2eb87f4ba49b48833470290d1, dated 2026-11-09
      (declaration outline of Basic.lean; in Flow.lean and Converse.lean
