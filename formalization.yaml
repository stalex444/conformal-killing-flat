fidelity:
  divergences: >-
    (a) Fields. The sources work with vector fields X^mu; the statements
    here are for the covector field omega_j = eta_j X^j (index lowered with
    the diagonal metric). In this form the Killing equation does not
    involve the metric, and the family of statement 1 is the lowered form
    of Schottenloher's X(q) = 2<q,b>q - <q,q>b + lambda q + c + omega q,
    with b_j = eta_j b^j, a_j = eta_j c^j and A_ij = eta_j omega^j_i, which
    is antisymmetric exactly when omega is in o(p,q). The statements are
    not restated for vector fields. (b) Definition. Schottenloher defines a
    conformal Killing field by its local flow being conformal and derives
    the equation X_{mu,nu} + X_{nu,mu} = kappa g_{mu nu} (Theorem 1.4);
    here the equation is the definition, with kappa = 2 phi and phi an
    arbitrary function (no regularity is assumed of phi; it is determined
    by omega when eta has a nonzero entry). The passage from conformal
    flows to the equation is not formalized. (c) Regularity and domain.
    Schottenloher's Theorem 1.7 is for smooth fields on a connected open
    subset of R^{p,q}; statements 1-4 are for C^3 fields on all of R^n.
    Neither contains the other: less regularity is assumed here, and
    nothing is said here about fields on a proper open subset. C^3 is
    what the proof uses (symmetry of third derivatives); nothing is
    claimed about C^2 or weaker solutions. (d) Metric. The metric is a
    function eta : Fin n -> R read as a diagonal matrix; IsSignature eta
    says each entry is 1 or -1, in any order, so every signature (p,q)
    occurs, with the coordinates in any order. Schottenloher's g^{p,q} is
    diag(1,...,1,-1,...,-1). A general nondegenerate constant metric is
    not treated. Statements 6 and 7 assume nothing about eta, so there eta
    may have zero or other real entries. (e) Statement 1 is an
    equivalence; the source proves that every conformal Killing field has
    the stated form and notes by direct calculation that the quadratic
    field solves the equation. In dimension two the equivalence fails:
    statement 5 shows this for the Euclidean plane, and a library example
    (not compared) for the Lorentzian plane. In dimension one every C^3
    field satisfies the equation, so the equivalence fails there as well
    (not proved in the repository). (f) Statements 3 and 4 are dimensions of real vector
    spaces of solutions (Module.finrank, with Module.Finite stated
    alongside, since Module.finrank is 0 by convention for a module that is
    not finite); the divisions of natural numbers are exact. The sources
    count generators (Ginsparg; Qualls), bound the number of independent
    Killing fields (Blau) or give the dimension of the conformal group
    (Poland, Rychkov and Vichi). No Lie bracket is defined and no
    isomorphism with so(p+1,q+1) or with the Poincare algebra is stated.
    No compared statement tests the hypothesis n >= 3 of statement 3. For
    n = 0 statement 4 says that the zero space has dimension 0. (g)
    Statement 5 asserts that an example exists in the Euclidean plane
    with eta = (1,1); the witness in the proof is the field (Re z^3,
    Im z^3). It says that the example is not
    family eta a A lam b for any a, lam, b and any real matrix A; the
    condition that A be antisymmetric, which statement 1 carries, is not
    imposed, so statement 5 is stronger than a control restricted to
    antisymmetric A. The general fact that the conformal Killing fields
    of the plane are the holomorphic functions is not formalized. (h) Statement 6 is pointwise: T and omega are
    differentiable at x, T(x) is symmetric, and the equation holds at x
    with a real number phi. Tensors are n x n real matrices with upper
    indices, the divergence is taken on the first index, and the current
    is J^i = sum_j T^ij omega_j. Blau's (10.16) is for a general metric
    with the covariant derivative; the flat diagonal case is the one
    formalized. (i) Statements 7 and 8 quantify over all differentiable
    tensor fields T : R^n -> matrices that are symmetric and
    divergence-free (and eta-trace-free in statement 7) at every point.
    Constant tensor fields are admitted, and the direction from conserved
    currents to the equation uses only the constant fields E_ij + E_ji and
    eta_j E_ii - eta_i E_jj, so it is a pointwise fact of linear algebra.
    Nothing is said about compactly supported or decaying tensor fields,
    for which that direction would need a different argument. The
    hypothesis that omega is C^3 stands outside the equivalence because it
    is part of the definitions of the two classes. For n <= 1 and a metric
    with entries 1 or -1 both sides of statement 7 hold for every C^3
    field. That direction was not found stated in the sources read; it is
    not claimed as new. (j) Statement 9: the field omega_j = eta_j x_j is
    the lowered form of the dilation X = x; its conformal factor is 1; the
    hypothesis n >= 1 is needed for "not Killing". (k) The proofs were
    written from a plan of the classical integrability argument, not from
    the text of one source. The second-derivative formula is Qualls's
    (2.13); the vanishing of the Hessian of the factor for n >= 3 is
    obtained from the symmetry of third derivatives by choosing a third
    index, where Schottenloher contracts with the metric (Theorem 1.6 and
    section 1.4.1); the conclusion is reached by showing that the field
    agrees with the member of the family having the same value, first
    derivative and gradient of the factor at the origin, where
    Schottenloher subtracts the quadratic and the dilation field and
    appeals to the Killing case. (l) Sources. Schottenloher's chapter was
    read in an Internet Archive capture of the chapter file on the
    author's university page, not in the Springer edition; Ginsparg,
    Simmons-Duffin, Qualls and Poland-Rychkov-Vichi were read in their
    arXiv versions; Blau's notes in the version of November 10, 2026;
    Liouville's Note in the OCR text of a scan. Di Francesco, Mathieu and
    Senechal and Callan, Coleman and Jackiw were not opened. (m) The
    application paragraph is cited, not a theorem; no compared statement
    asserts it.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    The axioms of every compared declaration were printed, the Challenge
    and Solution statements and definitions were checked identical by
    script, and the registry comparator was run locally (BUILD.txt). An
    AI-assisted adversarial review (Anthropic Claude, in Claude Code,
    under the author's direction) was applied to the classification and to
    the currents on 2026-11-11, each with compiled probe files that tested
    the statements for vacuity, for the necessity of the hypothesis
    n >= 3 and for unused hypotheses; its findings were applied. An
    AI-assisted prior-formalization search was made the same day, and an
    AI-assisted reading of the sources followed the assembly of the
    package. A further AI-assisted review, organised by the registry's
    published review prompts (metadata, statement alignment, definitions,
    literature, proof account), with compiled probe files and with each
    source that was read and the named files of each related repository
    re-checked, was applied to the
    assembled package on 2026-11-11, and the corrections it asked for,
    other than the author's own review of the statements, were made:
    statement 5 was strengthened so that it excludes the family for every
    real matrix A, as its description said (the stronger statement was
    already proved in the library); the other corrections were to text
    and metadata, among them commit dates in place of dates taken from a
    report, a shorter Challenge docstring, and the wording of the build
    record. A second AI-assisted pass verified those changes and
    corrected one docstring and six smaller wording points. The reports of
    these reviews and their probe files, of the
    prior-formalization search and of the sessions that wrote the Lean are working records of
    the author's project and are not part of this repository; where this
    file or README.md gives an account of the search or of contact with
    another development, it is the author's account from those records.
    The author reviewed statements 1-9 against their informal
    descriptions on 2026-11-11; they are unchanged since. Not
    peer-reviewed.

alignment:
  namespace: "FlatConformalKilling"
  statements:
    - source: "Schottenloher 2008, Theorem 1.7 (p. 17), with Theorems 1.4 and 1.6 and section 1.4.1; Ginsparg 1988, section 1.1, equations (1.2)-(1.3) and the list a)-d)"
      lean: "FlatConformalKilling.conformalKilling_iff_family"
      module: "Solution"
      status: "proved"
      note: "For n >= 3 and a diagonal metric with entries +1 or -1, a covector field is conformal Killing (C^3) if and only if it is a member of the explicit family: translations, rotations, the dilation, special conformal fields."
    - source: "Schottenloher 2008, section 1.4.1 (the fields with conformal Killing factor zero); Blau, Lecture Notes on General Relativity, (9.81)-(9.82)"
      lean: "FlatConformalKilling.killing_iff_affine"
      module: "Solution"
      status: "proved"
      note: "In every dimension a covector field is Killing (C^3) if and only if it is a + A x with A antisymmetric."
    - source: "Ginsparg 1988, section 1.1: the count (1/2)(p+q+1)(p+q+2) of generators; also Qualls, section 2.4, and Poland-Rychkov-Vichi 2019, section III.A"
      lean: "FlatConformalKilling.finrank_conformalKilling"
      module: "Solution"
      status: "proved"
      note: "For n >= 3 the conformal Killing fields form a finite-dimensional real vector space of dimension (n+1)(n+2)/2."
    - source: "Blau, Lecture Notes on General Relativity, (14.4) and the sentence after it on n-dimensional Minkowski space"
      lean: "FlatConformalKilling.finrank_killing"
      module: "Solution"
      status: "proved"
      note: "In every dimension the Killing fields form a finite-dimensional real vector space of dimension n(n+1)/2."
    - source: "Standard example: in the Euclidean plane the conformal Killing fields are the holomorphic functions (Schottenloher 2008, section 1.4.2; Ginsparg 1988, section 1.2); the instance z^3 is written out here"
      lean: "FlatConformalKilling.plane_conformalKilling_not_family"
      module: "Solution"
      status: "proved"
      note: "A control for n >= 3 in statement 1: in the Euclidean plane, eta = (1,1), there is a conformal Killing field that is not family eta a A lam b for any a, A, lam, b, where A is any real matrix, antisymmetric or not."
    - source: "Blau, Lecture Notes on General Relativity, (10.11)-(10.12) and (10.15)-(10.16); Simmons-Duffin, arXiv:1602.07982v1, (19)"
      lean: "FlatConformalKilling.div_current_of_conformal"
      module: "Solution"
      status: "proved"
      note: "At a point where T and omega are differentiable, T is symmetric and the conformal Killing equation holds with factor phi: div (T . omega) = (div T) . omega + phi tr_eta T."
    - source: "From the equation to conserved currents: Blau, (10.15)-(10.16); Simmons-Duffin, arXiv:1602.07982v1, (19)-(23). From conserved currents to the equation: not found stated in the sources read; elementary, proved here by testing on constant tensor fields"
      lean: "FlatConformalKilling.currents_conserved_iff_conformalKilling"
      module: "Solution"
      status: "proved"
      note: "A C^3 field is conformal Killing if and only if the current of every differentiable, symmetric, divergence-free, eta-trace-free tensor field against it is divergence-free."
    - source: "From the equation to conserved currents: Blau, (10.11)-(10.12); Simmons-Duffin, arXiv:1602.07982v1, (18)-(20). From conserved currents to the equation: not found stated in the sources read; elementary, proved here by testing on constant tensor fields"
      lean: "FlatConformalKilling.currents_conserved_iff_killing"
      module: "Solution"
      status: "proved"
      note: "A C^3 field is Killing if and only if the current of every differentiable, symmetric, divergence-free tensor field against it is divergence-free."
    - source: "Standard example: the dilatation (Schottenloher 2008, section 1.4.1; Blau, (10.19); Simmons-Duffin, arXiv:1602.07982v1, (24))"
      lean: "FlatConformalKilling.dilation_conformalKilling_not_killing"
      module: "Solution"
      status: "proved"
      note: "For n >= 1 the dilation omega_j = eta_j x_j is conformal Killing and is not Killing."

