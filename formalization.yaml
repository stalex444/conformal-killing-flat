    relationship: "other"
    note: >-
      PRIOR FORMALIZATION OF THE IDENTITY OF STATEMENT 6 IN ONE DIMENSION
      AND SIGNATURE. The file is
      lean/OAI/Analysis/TemperedDistribution/ConformalIdentities.lean in
      github.com/openai/math, read on 2026-11-11 at commit
      4eaee87548250b2682affda7d05d947c05554bae (its declaration outline,
      and lines 144-160, 301-332 and 400-452 in full). The commit read is
      dated 2026-10-30; in its history the file has one commit,
      adc7f1241b42e322a6451854ab7e4b4c146bf78a ("Initial commit"), dated
      2026-10-06.
      Setting:
      Spacetime := Fin 4 -> R, metric signs (+,-,-,-), tensors
      Fin 4 -> Fin 4 -> tempered distributions, complex-valued covector
      fields of temperate growth. Its predicate ConformalKilling is
      d_mu X_nu + d_nu X_mu = (1/2) metric_{mu nu} (div X). Its theorem
      conformal_current_divergence proves, for a symmetric tensor T and a
      temperate conformal Killing field X, that the divergence of the
      current is (1/4)(div X) trace T + sum_nu sign_nu X_nu (div T)_nu,
      and conformal_current_conserved concludes that the current is
      conserved when T is conserved and trace-free. That is the identity
      of statement 6 and the direction of statement 7 from the equation to
      conserved currents, for n = 4 and signature (1,3), in a
      distributional setting that statement 6 does not cover (statement 6
      is pointwise, for tensor fields differentiable at a point). The same
      file shows that translations and Lorentz generators satisfy its
      predicate (AffineKillingVector.conformalKilling). Not found in that
      file: other dimensions or signatures, the dilation or a special
      conformal field, a classification of the solutions, a dimension
      count, or the direction from conserved currents to the equation.
      Contact (the author's account, from working records that are not
      part of this repository; see review.notes): the file was found by
      the prior-formalization search of 2026-11-11, made while the library
      here was being written; the report of the session that wrote the
      classification names the author's own unpublished four-dimensional
      development as the reference it read, neither that report nor the
      report on the currents names this repository, and the file was first
      opened for this entry after the library and the compared statements
      were complete. Nothing of it is imported or reproduced. Recorded as
      "other", not "independent", because the report of the search, which
      quotes both declarations, was in hand when the Challenge was
      assembled.
