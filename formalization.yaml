# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Conformal Killing and Killing fields of flat pseudo-Euclidean space: classification for n >= 3 in every signature, the two dimension counts, and the divergence of the current of a symmetric tensor field"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of nine statements about
    R^n with a diagonal metric eta whose entries are +1 or -1 (every
    signature). A covector field omega is conformal Killing when it is C^3
    and d_i omega_j + d_j omega_i = 2 phi eta_ij for some function phi, and
    Killing when it is C^3 and d_i omega_j + d_j omega_i = 0. (1) For
    n >= 3 the conformal Killing fields are exactly the members of an
    explicit family: translations, rotations (an antisymmetric matrix), the
    dilation and the special conformal fields. (2) In every dimension the
    Killing fields are exactly the affine fields a + A x with A
    antisymmetric. (3) For n >= 3 the conformal Killing fields form a real
    vector space of finite dimension (n+1)(n+2)/2. (4) In every dimension
    the Killing fields form a real vector space of finite dimension
    n(n+1)/2. (5) A control for the hypothesis n >= 3 of (1): in the
    Euclidean plane there is a conformal Killing field that is not a
    member of the family for any values of its parameters, the matrix
    being any real matrix, antisymmetric or not (the witness in the proof
    is the real and imaginary parts of z^3). Statements (6)-(9) are
    statements about conserved currents: they say which fields give
    conserved currents. (6)
    If a tensor field T and a covector field omega are differentiable at a
    point x, T(x) is symmetric and the conformal Killing equation holds at
    x with factor phi, then the current J^i = sum_j T^ij omega_j satisfies
    div J = (div T) . omega + phi tr_eta T at x. (7) A C^3 field is
    conformal Killing if and only if the current of every differentiable,
    symmetric, divergence-free, eta-trace-free tensor field against it is
    divergence-free. (8) A C^3 field is Killing if and only if the current
    of every differentiable, symmetric, divergence-free tensor field
    against it is divergence-free. (9) For n >= 1 the dilation
    omega_j = eta_j x_j is conformal Killing and is not Killing. The
    Challenge imports Mathlib only and carries the definitions its
    statements use (the partial derivative, the two equations, the family,
    the two solution spaces as submodules, the divergences, the current and
    the metric trace), each with its convention. Statements (1)-(4) are
    classical: (1) and (3) are the classification of the conformal Killing
    fields of R^{p,q}, p + q >= 3, and the count of their parameters
    (Schottenloher 2008, Theorem 1.7; Ginsparg 1988, section 1.1), the
    infinitesimal counterpart of Liouville's theorem on conformal maps; (2)
    and (4) are the Killing fields of flat space and their number. (6) is
    the standard identity behind the conserved currents of a trace-free
    stress tensor, and (5) and (9) are standard examples. In (7) and (8)
    the direction from the equation to conserved currents is (6); the
    other direction was not found stated in the sources read for this
    entry, is elementary (it is proved by testing on constant tensor
    fields, so it is a pointwise fact of linear algebra) and is not claimed
    as new. No statement is claimed as a new theorem. Scope: diagonal
    metrics with entries +1 or -1 (a general constant metric, reached by a
    linear change of coordinates, is not formalized); C^3 covector fields
    on all of R^n; the numbers in (3) and (4) are dimensions of real vector
    spaces, with no Lie bracket and no isomorphism with so(p+1,q+1) stated;
    the finite conformal maps (Liouville's theorem itself) are not
    formalized; nothing is said about compactly supported tensor fields in
    (7) and (8). Prior formalization, recorded under
    related_formalizations: the identity (6), with its corollary for
    conserved trace-free tensors, is formalized for n = 4 and signature
    (1,3), for tensors of tempered distributions, in
    github.com/openai/math; special cases are in the Yang-Mills release
    github.com/yang-mills-group/OpenAI-YM-20261028, in
    facebookresearch/atlas-lean and in TauCetiProject/TauCeti. In a dated
    search no formalization was found of (1)-(5) or of the direction of (7)
    and (8) from conserved currents to the equation. Application (cited; no
    compared statement asserts it): for n = 4 and a Lorentzian signature
    the spaces of (3) and (4) have dimensions 15 and 10, the infinitesimal
    conformal symmetries and the infinitesimal isometries of Minkowski
    space, and (6) is the conservation law for the currents of a conserved
    symmetric stress tensor against them, trace-free in the conformal case.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.DG / 53C18 (conformal structures), 53B30 (local differential
  # geometry of Lorentz and indefinite metrics), 35N05 (overdetermined
  # systems of PDEs with constant coefficients): the classification and the
  # dimension counts. math-ph, gr-qc and hep-th / 70S10 (symmetries and
  # conservation laws), 81T40 (conformal field theories), 83A05 (special
  # relativity): the current identity and the cited application. No
  # compared statement is a physical claim.
  arxiv: ["math.DG", "math-ph", "gr-qc", "hep-th"]
  msc2020: ["53C18", "53B30", "35N05", "70S10", "81T40", "83A05"]

sources:
  - title: "A Mathematical Introduction to Conformal Field Theory"
    authors:
      - "M. Schottenloher"
    id: "Lecture Notes in Physics 759, 2nd edition, Springer, Berlin Heidelberg, 2008, Chapter 1"
    # Bibliographic record Crossref-verified 2026-11-11: DOI
    # 10.1007/978-3-540-68628-6. READ 2026-11-11: Chapter 1, sections
    # 1.3-1.4 (pp. 13-21), in the Internet Archive capture of the chapter
    # file on the author's university page (a text extraction of the PDF;
    # the file carries the Springer running heads and is dated 23-08-08),
    # web.archive.org/web/20140308070012/http://www.mathematik.uni-muenchen.de:80/~schotten/LNP-cft-pdf/01_978-3-540-68625-5_Ch01_23-08-08.pdf
    # Chapter 2 of the same set of files was searched for a dimension count
    # and none was found there. The Springer edition itself was not opened.
    type: "book"
    location: "https://doi.org/10.1007/978-3-540-68628-6"
    relationship: "formalizes"
    note: >-
      Scoped to statements 1, 2, 5 and 9. The source works with smooth
      vector fields X on an open subset M of R^{p,q}, calls X a conformal
      Killing field when its local flow is conformal (Definition 1.3), and
      shows that then X_{mu,nu} + X_{nu,mu} = kappa g_{mu nu} for a smooth
      function kappa (Theorem 1.4). Theorem 1.6 gives the equation
      (n - 2) kappa_{,mu nu} + g_{mu nu} Delta kappa = 0 for the factor,
      and section 1.4.1 concludes for n > 2 that kappa is affine. Theorem
      1.7 (p. 17): every conformal Killing field on a connected open subset
      of R^{p,q}, p + q > 2, is X(q) = 2<q,b>q - <q,q>b + lambda q + c +
      omega q with b, c in R^n, lambda real and omega in o(p,q); the text
      before it notes by direct calculation that the quadratic field solves
      the equation. Statement 1 is this classification for C^3 covector
      fields on all of R^n, stated as an equivalence, with the equation
      itself as the definition. The Killing fields (factor zero) are
      determined in section 1.4.1 as X(q) = c + omega q with omega in
      o(p,q), which is statement 2 in lowered form. That section is headed
      "Case 1: n = p + q > 2"; its argument for the fields with factor
      zero does not use the restriction, and statement 2 is proved here in
      every dimension. Section 1.4.2: in the
      Euclidean plane a conformal Killing field satisfies the
      Cauchy-Riemann equations and is a holomorphic function; the witness
      of statement 5 is the holomorphic function z^3. The dilatations
      X(q) = lambda q have a constant nonzero factor (section 1.4.1), the
      content of statement 9. Section 1.4.3 gives the conformal Killing
      fields of the Minkowski plane in light-cone variables; the library's
      example for the Lorentzian plane (not compared) is of that form.
      Exercise 1.8 states that the Lie algebra of the conformal Killing
      fields is isomorphic to o(p+1,q+1); no dimension is printed in the
      pages read. The proof here was not written from this text; see
      fidelity.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Applied Conformal Field Theory"
    authors:
      - "P. Ginsparg"
    id: "arXiv:hep-th/9108028v1"
    # READ 2026-11-11 as arXiv:hep-th/9108028v1 (sections 1.1 and 1.2). The
    # arXiv record gives the journal reference "Fields, Strings and Critical
    # Phenomena (Les Houches, Session XLIX, 1988), ed. by E. Brezin and J.
    # Zinn-Justin, 1989"; the printed volume was not opened and no page
    # numbers are quoted from it.
    type: "paper"
    location: "https://arxiv.org/abs/hep-th/9108028"
    relationship: "formalizes"
    note: >-
      Scoped to statements 1 and 3, with the remark behind statement 5.
      Section 1.1, for flat space of signature (p,q), d = p + q: the
      infinitesimal condition (1.2), d_mu eps_nu + d_nu eps_mu =
      (2/d)(d . eps) eta_{mu nu}; its consequence (1.3); for d > 2 the
      third derivatives of eps vanish, so eps is at most quadratic, and the
      solutions are listed as a) translations, b) rotations, c) scale
      transformations and d) special conformal transformations
      eps_mu = b_mu x^2 - 2 x_mu b.x; the text then counts
      p + q + (1/2)(p+q)(p+q-1) + 1 + (p+q) = (1/2)(p+q+1)(p+q+2)
      generators and identifies the algebra with that of SO(p+1,q+1).
      Statement 3 is that count, stated as the dimension of the real
      vector space of C^3 solutions on R^n. Section 1.2: for d = 2 the
      condition becomes the Cauchy-Riemann equations and the local algebra
      is infinite dimensional, which is why statement 1 needs n >= 3.
      Regularity and domain are not specified in the source.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Lecture Notes on General Relativity"
    authors:
      - "M. Blau"
    id: "Lecture notes, Universitaet Bern; the version marked 'Last update November 10, 2026'"
    # READ 2026-11-11 in the PDF linked from the author's page
    # (blau.itp.unibe.ch/newlecturesGR.pdf, fetched that day; text
    # extraction): section 9.6 at (9.81)-(9.82); section 10.1 at
    # (10.11)-(10.12); section 10.2, (10.14)-(10.18); section 10.3 at
    # (10.19)-(10.26); section 14.1 at (14.2)-(14.4); section 7.7 at
    # (7.122). Section and equation numbers are those of that version; the
    # notes are revised from time to time.
    type: "other"
    location: "http://www.blau.itp.unibe.ch/GRLecturenotes.html"
    relationship: "formalizes"
    note: >-
      Lecture notes on the author's web page. Scoped to statements 2, 4, 6
      and 9 and to one direction of statements 7 and 8. (9.81)-(9.82): in
      inertial coordinates on Minkowski space the Killing condition
      d_a V_b + d_b V_a = 0 is solved by V_a = omega_{ab} z^b + eps_a with
      omega antisymmetric (statement 2; the notes assert the solution
      without proof). (14.2)-(14.4): a Killing field is determined by its
      value and first derivative at a point, so there are at most
      n + n(n-1)/2 = n(n+1)/2 independent ones, and n-dimensional Minkowski
      space attains this number (statement 4). (10.11)-(10.12) and
      (10.15)-(10.16): for a symmetric T and a conformal Killing vector C
      with nabla_mu C_nu + nabla_nu C_mu = 2 sigma g_{mu nu},
      nabla_mu (T^{mu nu} C_nu) = (nabla_mu T^{mu nu}) C_nu +
      sigma T^{mu nu} g_{mu nu}, which vanishes when T is conserved and
      trace-free, and for a Killing vector when T is conserved; this is
      statement 6 and the direction of statements 7 and 8 from the equation
      to conserved currents. The notes work on a general metric with the
      covariant derivative; the statements here are the flat case with a
      diagonal metric. (10.19): the dilatation D = z^a d_a satisfies
      d_a D_b + d_b D_a = 2 eta_{ab} (statement 9, with factor 1).
      Sections 10.3 and 7.7 are the source of the cited application: the
      10 Killing and 5 further conformal Killing vectors of
      four-dimensional Minkowski space, and the vanishing trace of the
      Maxwell energy-momentum tensor in four dimensions (7.122). The
      direction of statements 7 and 8 from conserved currents to the
      equation is not in the sections read.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The Conformal Bootstrap"
    authors:
      - "D. Simmons-Duffin"
    id: "New Frontiers in Fields and Strings (TASI 2015), World Scientific, pp. 1-74"
    # Bibliographic record Crossref-verified 2026-11-11: DOI
    # 10.1142/9789813149441_0001. READ 2026-11-11 as arXiv:1602.07982v1,
    # "TASI Lectures on the Conformal Bootstrap" (section 2.4 and the
    # opening of section 3, equations (18)-(25), with footnote l); equation
    # numbers are the arXiv version's. The published chapter was not read.
    type: "paper"
    location: "https://doi.org/10.1142/9789813149441_0001"
    relationship: "formalizes"
    note: >-
      Scoped to statement 6 and to one direction of statements 7 and 8, in
      flat Euclidean space. (18)-(20): the charge built from
      eps_nu T^{mu nu} is conserved whenever
      0 = d_mu (eps_nu T^{mu nu}) = (1/2)(d_mu eps_nu + d_nu eps_mu)
      T^{mu nu}, "or" d_mu eps_nu + d_nu eps_mu = 0, the Killing equation,
      with solutions the translations and rotations (21). (22)-(24): when
      the stress tensor is traceless "we can relax the requirement (20)
      further to" d_mu eps_nu + d_nu eps_mu = c(x) delta_{mu nu}, the
      conformal Killing equation, with the additional solutions the
      dilatation and the special conformal fields. The text presents the
      two equations as the conditions under which the currents are
      conserved and shows that they suffice; it does not state or prove
      that conservation for all such tensors forces the equation. Footnote
      l notes the additional solutions in two dimensions. Read as the
      arXiv version, not the published chapter.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Lectures on Conformal Field Theory"
    authors:
      - "J. D. Qualls"
    id: "arXiv:1511.04074v2"
    # READ 2026-11-11 as arXiv:1511.04074v2 (Lecture 2, sections 2.1, 2.2
    # and 2.4: equations (2.5)-(2.15) and the count of generators; the list
    # of references of that lecture).
    type: "paper"
    location: "https://arxiv.org/abs/1511.04074"
    relationship: "background"
    note: >-
      The textbook derivation written out step by step, for d >= 3: (2.13),
      2 d_mu d_nu eps_rho = (2/d)(-eta_{mu nu} d_rho + eta_{rho mu} d_nu +
      eta_{nu rho} d_mu)(d . eps), is the formula proved in the library as
      ConformalKillingFlat.second_deriv; (2.8)-(2.9) give that d . eps is at
      most linear and eps at most quadratic; section 2.4 counts
      1 + d + d + d(d-1)/2 = (d+2)(d+1)/2 generators. The lecture names
      chapter 2 of Blumenhagen and Plauschinn and chapter 4 of Di
      Francesco, Mathieu and Senechal as its main references. Not used to
      write the proofs here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The conformal bootstrap: Theory, numerical techniques, and applications"
    authors:
      - "D. Poland"
      - "S. Rychkov"
      - "A. Vichi"
    id: "Reviews of Modern Physics 91 (2019), 015002"
    # Bibliographic record Crossref-verified 2026-11-11: DOI
    # 10.1103/RevModPhys.91.015002. READ 2026-11-11 as arXiv:1805.04405v3
    # (section III.A, "Conformal transformations", with its footnotes, and
    # the reference-list entry for Monge 1850); the journal version was not
    # read.
    type: "paper"
    location: "https://doi.org/10.1103/RevModPhys.91.015002"
    relationship: "background"
    note: >-
      Current review of the subject in which the classification is used.
      Section III.A of arXiv:1805.04405v3 says that in any dimension
      d >= 3 a theorem of Liouville gives every conformal transformation as
      a composition of translations, rotations, dilatations and
      inversions, that the resulting conformal group is a Lie group of
      dimension (d+1)(d+2)/2, and that the two-dimensional case is special
      because every holomorphic function defines a conformal
      transformation; its reference list cites pp. 609-616 of Monge (1850)
      for Liouville's theorem. Read as the arXiv version. Not used in any
      proof here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Extension au cas des trois dimensions de la question du tracé géographique (Note VI)"
    authors:
      - "J. Liouville"
    id: "In G. Monge, Application de l'analyse à la géométrie, 5th edition, revised, corrected and annotated by J. Liouville, Bachelier, Paris, 1850, pp. 609-616"
    # READ 2026-11-11 in the OCR text of the Internet Archive scan
    # archive.org/details/applicationdelan00mong (University of Illinois
    # copy): the table of contents entry, sections 1-2 of the Note
    # (pp. 609-610) and its closing paragraphs (p. 616). The OCR of the
    # formulas is poor; the statements were read from the prose.
    type: "book"
    location: "https://archive.org/details/applicationdelan00mong"
    relationship: "background"
    note: >-
      Liouville's theorem on conformal maps, for three-dimensional
      Euclidean space: the Note asks for the correspondences of space in
      which corresponding infinitely small parts are similar, with a ratio
      that may vary from point to point; its section 2 treats the case of
      ratio one (equal or symmetric figures), and its closing paragraphs
      conclude that the formula given by the transformation by reciprocal
      radii (inversion) is the most general one. The middle of the Note
      was not read. It concerns finite maps in dimension three and one
      signature. No compared statement formalizes it: statements 1 and 3
      are the infinitesimal counterpart, in every dimension n >= 3 and
      every signature, and the theorem on finite maps is listed as not
      formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Conformal Field Theory"
    authors:
      - "P. Di Francesco"
      - "P. Mathieu"
      - "D. Sénéchal"
    id: "Graduate Texts in Contemporary Physics, Springer, New York, 1997"
    # Bibliographic record Crossref-verified 2026-11-11: DOI
    # 10.1007/978-1-4612-2256-9. NOT OPENED. Named because Qualls gives its
    # chapter 4 as a main reference for the derivation and Simmons-Duffin
    # and Poland-Rychkov-Vichi list it as a standard text.
    type: "book"
    location: "https://doi.org/10.1007/978-1-4612-2256-9"
    relationship: "background"
    note: >-
      The standard textbook of the subject, not opened for this entry. No
      statement about its content is made here beyond what Qualls reports:
      that his derivation of the infinitesimal conformal transformations
      in d >= 3 follows its chapter 4.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A new improved energy-momentum tensor"
    authors:
      - "C. G. Callan"
      - "S. Coleman"
      - "R. Jackiw"
    id: "Annals of Physics 59 (1970), no. 1, 42-73"
    # Bibliographic record Crossref-verified 2026-11-11: DOI
    # 10.1016/0003-4916(70)90394-5. NOT OPENED. Cited as Blau's section
    # 22.4 (footnote 64) cites it.
    type: "paper"
    location: "https://doi.org/10.1016/0003-4916(70)90394-5"
    relationship: "background"
    note: >-
      The cited application only. Not opened; named as the paper that
      Blau's notes (section 22.4, footnote 64) cite for the question of
      when an energy-momentum tensor can be improved to a symmetric,
      conserved, trace-free one, so that the dilatation current is
      T^{ab} x_b, the current of statement 6 for the dilation. Not used in
      any proof.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
