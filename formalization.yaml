  - id: "https://github.com/stalex444/pdt-em-source-selection/tree/1c9ba637b5e664a88b6487d463515587616476e1"
    relationship: "other"
    note: >-
      THE CITED APPLICATION, BY THE SAME AUTHOR; NO MODULE IS SHARED.
      Registry record PALOMAR-2026-10-14-000009 (selection of the
      electromagnetic source tensor). It proves, on a fixed flat Lorentz
      frame in dimension four, that covariance and zero trace, or
      conservation on source-free Maxwell first jets alone, select the
      Maxwell stress among symmetric quadratic sources up to scale. The
      Maxwell stress is thus a symmetric, trace-free tensor that is
      conserved on source-free fields, the kind of tensor to which
      statement 6 applies with a conformal Killing field. That entry works
      with sources as functions of the field components and with first
      jets, not with tensor fields T on R^n as here; the passage from one
      setting to the other is not formalized in either entry, and neither
      entry imports the other.
  - id: "https://github.com/leanprover-community/mathlib4/tree/065356127b1dc0016f66b7283ce0ce2c4055aa55"
    relationship: "builds-on"
    note: >-
      Mathlib declarations used by the compared statements include fderiv,
      ContDiff, DifferentiableAt, Matrix, Matrix.transpose, Pi.single,
      Submodule, Module.Finite and Module.finrank. Mathlib at the pin has
      no Killing or conformal Killing vector field (its declarations named
      Killing concern the Killing form of a Lie algebra, and its conformal
      declarations concern conformal linear maps and conformal maps), which
      is why the two equations are written out as definitions in the
      Challenge. The library identifies its space of antisymmetric
      matrices with Mathlib's LieAlgebra.Orthogonal.so (Fin n) R as
